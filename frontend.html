<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBite - Recipe Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="#">🥗 FreshBite</a>
            <span class="nav-text">Find your next meal</span>
        </div>
    </nav>

    <section class="hero">
        <div class="container text-center">
            <p class="small-heading">YOUR DAILY FOOD GUIDE</p>
            <h1>Find something <span>delicious.</span></h1>
            <p class="hero-text">Search for your favourite recipes.</p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search recipes..." />
                <button id="searchBtn">Search</button>
            </div>

            <div class="filter-box">
                <label for="categorySelect">Category</label>
                <select id="categorySelect">
                    <option value="all">All Recipes</option>
                    <option value="veg">Veg</option>
                    <option value="nonveg">Non-Veg</option>
                </select>
            </div>
        </div>
    </section>

    <section class="container recipe-section">
        <div class="recipe-heading">
            <p id="recipeCount"></p>
        </div>

        <p id="message">Search for a recipe to get started.</p>

        <div class="row g-4" id="recipeList"></div>

        <div id="noRecipes" class="text-center">
            <h3>No recipes found</h3>
            <p>Try another recipe name.</p>
        </div>
    </section>

    <footer>
        <p>Made with ❤️ for food lovers</p>
    </footer>

    <script src="code.js"></script>
</body>
</html>
